{{# lw = max(len(left_text) * 8 + 20, 24); rw = max(len(right_text) * 8 + 20, 24); rad = shape == 'pill' ? 14 : shape == 'rounded' ? 5 : 0 }}
<svg xmlns="http://www.w3.org/2000/svg" width="{{lw + rw}}" height="28" viewBox="0 0 {{lw + rw}} 28" role="img" aria-label="{{left_text}}: {{right_text}}">
  <defs>
    <clipPath id="clip">
      <rect width="{{lw + rw}}" height="28" rx="{{rad}}"/>
    </clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="{{lw}}" height="28" fill="{{left_color}}"/>
    <rect x="{{lw}}" width="{{rw}}" height="28" fill="{{right_color}}"/>
  </g>
  {{outline == 'on' ? '<rect width="' + (lw + rw) + '" height="28" rx="' + rad + '" fill="none" stroke="' + outline_color + '" stroke-width="2"/>' : ''}}
  <text x="{{lw / 2}}" y="18" text-anchor="middle" font-family="Verdana, sans-serif" font-size="11" fill="{{font_color}}">{{left_text}}</text>
  <text x="{{lw + rw / 2}}" y="18" text-anchor="middle" font-family="Verdana, sans-serif" font-size="11" fill="{{font_color}}">{{right_text}}</text>
</svg>