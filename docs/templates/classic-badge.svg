{{# icon = 0.5 * height; ix = 0.22 * width - 0.25 * height }}
<svg xmlns="http://www.w3.org/2000/svg" width="{{width}}" height="{{height}}" viewBox="0 0 {{width}} {{height}}" role="img" aria-label="{{text2}}">
  <rect width="{{width}}" height="{{height}}" rx="{{0.5 * height}}" fill="#263759"/>
  <image href="{{text1}}" x="{{ix}}" y="{{0.25 * height}}" width="{{icon}}" height="{{icon}}" preserveAspectRatio="xMidYMid meet"/>
  <text x="{{0.62 * width}}" y="{{0.66 * height}}" text-anchor="middle" font-family="Verdana, sans-serif" font-size="{{0.35 * height}}" fill="#ffffff">{{text2}}</text>
</svg>