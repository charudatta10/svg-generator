{{# w = max(len(right_text) * 8 + 20, 24); rad = shape == 'pill' ? 14 : shape == 'rounded' ? 5 : 0 }}
<svg xmlns="http://www.w3.org/2000/svg" width="{{w}}" height="28" viewBox="0 0 {{w}} 28" role="img" aria-label="{{right_text}}">
  <rect width="{{w}}" height="28" rx="{{rad}}" fill="{{right_color}}"/>
  {{outline == 'on' ? '<rect width="' + w + '" height="28" rx="' + rad + '" fill="none" stroke="' + outline_color + '" stroke-width="2"/>' : ''}}
  <text x="{{w / 2}}" y="18" text-anchor="middle" font-family="Verdana, sans-serif" font-size="11" fill="{{font_color}}">{{right_text}}</text>
</svg>